spring:
  application:
    name: dispatch-manifest-hub
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}

dispatch:
  archive:
    bucket: ${MANIFEST_ARCHIVE_BUCKET:campusshop-dispatch-manifests}
  shipments:
    table: ${SHIPMENT_TABLE:campusshop-shipments}
  aws:
    endpoint: ${AWS_ENDPOINT:http://localhost:4566}
    region: ${AWS_REGION:eu-central-1}
    access-key: ${AWS_ACCESS_KEY_ID:test}
    secret-key: ${AWS_SECRET_ACCESS_KEY:test}

tariff-service:
  # rest = HTTP call to the tariff service. simulation = in-process tariffs (offline development).
  mode: ${TARIFF_SERVICE_MODE:rest}
  url: ${TARIFF_SERVICE_URL:http://localhost:8082}
  timeout-ms: ${TARIFF_SERVICE_TIMEOUT_MS:2000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    de.campusshop.dispatch: INFO
